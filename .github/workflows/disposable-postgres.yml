name: Disposable PostgreSQL Operations
on:
  push:
    branches:
      - work/iway-r1-r10-consolidated-certification-20261019
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify twenty tracking baseline policy cases
        run: node --test tests/local/tracking-baseline-policy.test.mjs
      - name: Install disposable PostgreSQL prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 openssl
          test -x /usr/lib/postgresql/16/bin/initdb
          test -x /usr/bin/openssl
      - name: Exercise local PostgreSQL operations and RLS
        env:
          IWAY_OPERATIONS_LOCAL_OPT_IN: '1'
          IWAY_LOCAL_PG_BIN: /usr/lib/postgresql/16/bin
          IWAY_LOCAL_OPENSSL: /usr/bin/openssl
          IWAY_TRACKING_BASELINE_REPORT: artifacts/tracking-baseline.json
        run: node scripts/certify-postgres.mjs local --operations-isolated
      - name: Repeat independent disposable PostgreSQL benchmarks
        env:
          IWAY_OPERATIONS_LOCAL_OPT_IN: '1'
          IWAY_LOCAL_PG_BIN: /usr/lib/postgresql/16/bin
          IWAY_LOCAL_OPENSSL: /usr/bin/openssl
        run: |
          for i in 2 3; do
            IWAY_TRACKING_BASELINE_REPORT="artifacts/tracking-baseline-run-${i}.json" node scripts/certify-postgres.mjs local --operations-isolated
          done
      - name: Compare independent tracking baselines
        run: node scripts/compare-tracking-baselines.mjs artifacts/tracking-baseline.json artifacts/tracking-baseline-run-2.json artifacts/tracking-baseline-run-3.json > artifacts/tracking-baseline-comparison.json
      - name: Upload tracking performance baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracking-postgres-baseline
          path: artifacts/tracking-baseline*.json
          if-no-files-found: warn
          retention-days: 14
