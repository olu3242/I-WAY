name: Identity access certification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run site:build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: node scripts/report-mvp-coverage.mjs
  disposable-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install disposable database prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 openssl
          test -x /usr/lib/postgresql/16/bin/initdb
          test -x /usr/bin/openssl
      - name: Certify isolated operations persistence and RLS
        env:
          IWAY_OPERATIONS_LOCAL_OPT_IN: '1'
          IWAY_LOCAL_PG_BIN: /usr/lib/postgresql/16/bin
          IWAY_LOCAL_OPENSSL: /usr/bin/openssl
        run: npm run test:pg:operations:local
      - name: Certify isolated authentication lifecycle
        env:
          IWAY_AUTH_LOCAL_OPT_IN: 'true'
          IWAY_LOCAL_PG_BIN: /usr/lib/postgresql/16/bin
          IWAY_LOCAL_OPENSSL: /usr/bin/openssl
        run: node scripts/test-auth-postgres-isolated.mjs
      - name: Certify isolated UAT broker
        env:
          IWAY_UAT_LOCAL_OPT_IN: 'true'
          IWAY_LOCAL_PG_BIN: /usr/lib/postgresql/16/bin
          IWAY_LOCAL_OPENSSL: /usr/bin/openssl
        run: node --test tests/local/uat-postgres.test.mjs
      - name: Certify durable Operations transactions and restart recovery
        env:
          IWAY_DURABLE_LOCAL_OPT_IN: 'true'
          IWAY_LOCAL_PG_BIN: /usr/lib/postgresql/16/bin
          IWAY_LOCAL_OPENSSL: /usr/bin/openssl
        run: node --test tests/local/durable-operations-postgres.test.mjs
      - name: Certify isolated onboarding command custody
        env:
          IWAY_MANAGEMENT_LOCAL_OPT_IN: 'true'
          IWAY_LOCAL_PG_BIN: /usr/lib/postgresql/16/bin
          IWAY_LOCAL_OPENSSL: /usr/bin/openssl
        run: node --test tests/local/uat-management-postgres.test.mjs
      - name: Certify hosted HTTP logistics across an actual PostgreSQL restart
        env:
          IWAY_BROWSER_DURABLE_OPT_IN: 'true'
          IWAY_LOCAL_PG_BIN: /usr/lib/postgresql/16/bin
          IWAY_LOCAL_OPENSSL: /usr/bin/openssl
        run: node --test tests/local/hosted-logistics-postgres.test.mjs
  durable-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Install disposable database prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 openssl
      - name: Exercise hosted handler with four personas and durable Operations
        env:
          IWAY_BROWSER_DURABLE_OPT_IN: 'true'
          IWAY_LOCAL_PG_BIN: /usr/lib/postgresql/16/bin
          IWAY_LOCAL_OPENSSL: /usr/bin/openssl
        run: npx playwright test tests/browser/uat-application.spec.mjs
      - name: Retain synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: durable-browser-evidence
          path: |
            dist/browser-report
            dist/browser-results
          retention-days: 7
