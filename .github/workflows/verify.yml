name: Verify
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/check-merge-conflicts.mjs
      - run: npm run verify
      - run: node --test tests/r2-app-support-integration.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/browser/early-access.spec.mjs tests/browser/operations.spec.mjs tests/browser/accessibility.spec.mjs tests/browser/administration.spec.mjs

      - name: Preserve browser failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-browser-evidence
          path: |
            dist/browser-results/
            dist/browser-report/
          if-no-files-found: ignore
          retention-days: 7
