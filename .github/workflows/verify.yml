name: Verify
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/check-merge-conflicts.mjs
      - run: npm run verify
      - run: node --test tests/r2-app-support-integration.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/browser/early-access.spec.mjs tests/browser/operations.spec.mjs tests/browser/accessibility.spec.mjs tests/browser/administration.spec.mjs
