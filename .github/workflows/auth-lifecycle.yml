name: Auth lifecycle PostgreSQL
on:
  push:
    branches: [work/b391-b398-hosted-identity-certification]
  pull_request:
    branches: [fix/iway-e2e-identity-access-remediation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture_only_password
          POSTGRES_DB: iway_auth_fixture
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d iway_auth_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: fixture_only_password
      PGDATABASE: iway_auth_fixture
      IWAY_AUTH_FIXTURE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - run: node --test tests/operations-auth-*.test.mjs tests/operations-supabase-*.test.mjs
      - run: node --test tests/local/operations-auth-postgres.test.mjs
      - run: node scripts/package-auth-staging.mjs
      - run: npm ci --ignore-scripts --omit=dev
        working-directory: dist/auth-staging

      - run: node scripts/check-auth-vercel-build.mjs prepare dist/auth-staging
      - run: npm exec --yes --package=vercel@54.2.0 -- vercel build --target preview --standalone --non-interactive
        working-directory: dist/auth-staging
      - run: node scripts/check-auth-vercel-build.mjs verify dist/auth-staging
