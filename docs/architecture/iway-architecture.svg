<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" font-family="Inter,Arial,sans-serif" role="img" aria-labelledby="t d"><title id="t">I-way proposed system architecture</title><desc id="d">Four client applications call one shared API with an authorization layer and domain modules, backed by data services and external integrations. The public website is a separate zone.</desc>
