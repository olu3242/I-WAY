<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>I-way | Support</title><link rel="stylesheet" href="/assets/css/styles.css"></head>
<body><a class="skip" href="#main">Skip to content</a><header><nav aria-label="Main navigation"><a class="brand" href="/">I-way</a><a href="/early-access.html">Early access</a></nav></header>
<main id="main"><h1>Support center</h1><p id="support-status" role="status" aria-live="polite">Checking your session…</p>
<section id="support-panel" hidden><h2>Ask for guidance</h2><form id="support-question"><label for="question">Question</label><textarea id="question" required maxlength="2000"></textarea><button type="submit">Get guidance</button></form><div id="guidance" role="status" aria-live="polite"></div>
<h2>Open a support ticket</h2><form id="support-ticket"><label for="subject">Issue summary</label><input id="subject" required maxlength="300"><label for="priority">Priority</label><select id="priority"><option value="P3">Normal</option><option value="P2">High</option><option value="P1">Urgent</option></select><button type="submit">Submit ticket</button></form><p id="ticket-result" role="status" aria-live="polite"></p></section></main>
<script type="module" src="/assets/js/support-ui.js"></script></body></html>
